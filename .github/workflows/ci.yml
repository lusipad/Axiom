name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip

      - uses: pnpm/setup@v1
        with:
          version: "11.21.0"
          runtime: node@24
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          package-json-file: web/package.json
          install: false

      - name: Install Python dependencies
        run: python -m pip install -c constraints/acceptance.txt -e ".[test]"

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Verify web application
        run: |
          pnpm --dir web test
          pnpm --dir web check
          pnpm --dir web build
          git diff --exit-code -- src/axiom/web_dist

      - name: Verify Python application
        run: python -m pytest
