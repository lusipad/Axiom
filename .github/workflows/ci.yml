name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  AXIOM_REQUIRE_ENVIRONMENT_BOUND_GOLDENS: "1"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: pnpm/setup@v1
        with:
          version: "11.21.0"
          runtime: node@24
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          package-json-file: web/package.json
          install: false

      - name: Install Python dependencies
        run: python -m pip install -c constraints/acceptance.txt -e ".[test]"

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Verify Windows OPC UA shadow adapter
        run: |
          dotnet restore adapters/opcua-shadow/Axiom.OpcUaShadow.sln --locked-mode
          dotnet build adapters/opcua-shadow/Axiom.OpcUaShadow.sln -c Release --no-restore
          dotnet run --project adapters/opcua-shadow/tests/Axiom.OpcUaShadow.Conformance -c Release --no-build

      - name: Verify web application
        run: |
          pnpm --dir web test
          pnpm --dir web check
          pnpm --dir web build
          git diff --exit-code -- src/axiom/web_dist

      - name: Verify Python application
        run: python -m pytest
