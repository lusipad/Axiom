name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-windows-fixtures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -c constraints/acceptance.txt -e ".[test]"

      - name: Verify Windows-bound five-axis identities
        run: python -m pytest tests/test_five_axis_f2_fixture.py tests/test_five_axis_f3_fixture.py

  publish:
    needs: verify-windows-fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip

      - uses: pnpm/setup@v1
        with:
          version: "11.21.0"
          runtime: node@24
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          package-json-file: web/package.json
          install: false

      - name: Install dependencies
        run: |
          python -m pip install -c constraints/acceptance.txt -e ".[test]"
          python -m pip install build
          pnpm --dir web install --frozen-lockfile

      - name: Verify release source
        run: |
          pnpm --dir web test
          pnpm --dir web check
          pnpm --dir web build
          git diff --exit-code -- src/axiom/web_dist
          python -m pytest

      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")

      - name: Build release artifacts
        run: python -m build

      - name: Verify bundled workbench
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          required = (
              "axiom/web_dist/index.html",
              "axiom/web_dist/assets/",
              "axiom/five_axis/fixtures/manifest.json",
              "axiom/five_axis/fixtures/math_stage_manifest.json",
              "axiom/five_axis/fixtures/sampled_cartesian_view.json",
          )
          for entry in required:
              if not any(name == entry or name.startswith(entry) for name in names):
                  raise SystemExit(f"release wheel is missing {entry}")

      - name: Smoke test installed wheel
        run: |
          python -m venv release-smoke
          release-smoke/bin/python -m pip install dist/*.whl
          release-smoke/bin/axiom --help
          release-smoke/bin/axiom serve --host 127.0.0.1 --port 8765 > release-smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/api/v1/health > release-smoke/health.json; then
              ready=true
              break
            fi
            sleep 0.25
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8765/ | grep '<div id="root"></div>'
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data-binary @fixtures/cnc_scenarios/experiments/cnc-contour-true-ab.json \
            http://127.0.0.1:8765/api/v1/experiments/run \
            > release-smoke/report.json
          release-smoke/bin/python -c "import json; report=json.load(open('release-smoke/report.json')); assert report['caseOutcome'] == 'Failed'; assert report['comparison']['compatibility']['compatible'] is True; assert report['contentHash']"
          curl --fail --silent \
            'http://127.0.0.1:8765/api/v1/examples/five-axis-f2?scenarioId=configuration-interior-collision' \
            > release-smoke/f2-example.json
          release-smoke/bin/python -c "import json; payload=json.load(open('release-smoke/f2-example.json')); json.dump(payload['runSpec'], open('release-smoke/f2-run-spec.json', 'w'))"
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data-binary @release-smoke/f2-run-spec.json \
            http://127.0.0.1:8765/api/v1/runs/evaluate \
            > release-smoke/f2-run-bundle.json
          release-smoke/bin/python -c "import json; bundle=json.load(open('release-smoke/f2-run-bundle.json')); claims={claim['claimDefinitionId']: claim['status'] for claim in bundle['claims']}; assert bundle['run']['executionStatus'] == 'Succeeded'; assert bundle['run']['caseOutcome'] == 'Passed'; assert bundle['report']['caseOutcome'] == 'Passed'; assert claims['five-axis.kinematically-feasible-claim@1'] == 'Supported'; assert claims['five-axis.configuration-collision-free-claim@1'] == 'Refuted'; assert bundle['bundleHash']"
          curl --fail --silent \
            'http://127.0.0.1:8765/api/v1/examples/five-axis-f3?scenarioId=canonical-table-table-jerk' \
            > release-smoke/f3-example.json
          release-smoke/bin/python -c "import json; payload=json.load(open('release-smoke/f3-example.json')); json.dump(payload['runSpec'], open('release-smoke/f3-run-spec.json', 'w'))"
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data-binary @release-smoke/f3-run-spec.json \
            http://127.0.0.1:8765/api/v1/runs/evaluate \
            > release-smoke/f3-run-bundle.json
          release-smoke/bin/python -c "import json; bundle=json.load(open('release-smoke/f3-run-bundle.json')); claims={claim['claimDefinitionId']: claim['status'] for claim in bundle['claims']}; assert bundle['run']['executionStatus'] == 'Succeeded'; assert bundle['run']['caseOutcome'] == 'Passed'; assert claims['five-axis.continuously-feasible-claim@1'] == 'Supported'; assert claims['five-axis.interval-certified-claim@1'] == 'Supported'; assert not {'five-axis.model-collision-free-claim@1', 'five-axis.device-safe-claim@1', 'five-axis.process-safe-claim@1'} & claims.keys(); assert bundle['bundleHash']"
          curl --fail --silent \
            'http://127.0.0.1:8765/api/v1/examples/five-axis-f3?scenarioId=second-order-proven-optimal' \
            > release-smoke/f3-discrete-example.json
          release-smoke/bin/python -c "import json; payload=json.load(open('release-smoke/f3-discrete-example.json')); descriptor=next(item for item in payload['manifest']['artifactDescriptors'] if item['stage'] == 'M5'); assert 'sampledTrajectory' not in payload['artifacts']; assert payload['artifacts']['discreteCommand']['artifactType'] == 'five-axis.m5-discrete-command'; assert descriptor == {'stage': 'M5', 'artifactType': 'five-axis.m5-discrete-command', 'schemaId': 'five-axis.m5-discrete-command@1'}; json.dump(payload['runSpec'], open('release-smoke/f3-discrete-run-spec.json', 'w'))"
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data-binary @release-smoke/f3-discrete-run-spec.json \
            http://127.0.0.1:8765/api/v1/runs/evaluate \
            > release-smoke/f3-discrete-run-bundle.json
          release-smoke/bin/python -c "import json; bundle=json.load(open('release-smoke/f3-discrete-run-bundle.json')); claims={claim['claimDefinitionId']: claim['status'] for claim in bundle['claims']}; assert bundle['run']['executionStatus'] == 'Succeeded'; assert bundle['run']['caseOutcome'] == 'Unsupported'; assert bundle['report']['caseOutcome'] == 'Unsupported'; assert claims['five-axis.continuously-feasible-claim@1'] == 'Supported'; assert claims['five-axis.interval-certified-claim@1'] == 'Inconclusive'; assert not {'five-axis.model-collision-free-claim@1', 'five-axis.device-safe-claim@1', 'five-axis.process-safe-claim@1'} & claims.keys(); assert bundle['bundleHash']"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Axiom $GITHUB_REF_NAME"
          fi
