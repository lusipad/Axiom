name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  AXIOM_REQUIRE_ENVIRONMENT_BOUND_GOLDENS: "1"
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip

      - uses: pnpm/setup@v1
        with:
          version: "11.21.0"
          runtime: node@24
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          package-json-file: web/package.json
          install: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade -c constraints/acceptance.txt pip
          python -m pip install -c constraints/acceptance.txt -e ".[test]"
          python -m pip install build
          pnpm --dir web install --frozen-lockfile

      - name: Verify release source
        run: |
          pnpm --dir web test
          pnpm --dir web check
          pnpm --dir web build
          git diff --exit-code -- src/axiom/web_dist
          python -m pytest

      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")

      - name: Build release artifacts
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          python -m build

      - name: Verify bundled workbench
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          required = (
              "axiom/web_dist/index.html",
              "axiom/web_dist/assets/",
              "axiom/five_axis/fixtures/manifest.json",
              "axiom/five_axis/fixtures/math_stage_manifest.json",
              "axiom/five_axis/fixtures/sampled_cartesian_view.json",
              "axiom/machine/fixtures/manifest.json",
              "axiom/machine/fixtures/captures/read-only-paired-pass.trace.json",
              "axiom/physical/fixtures/manifest.json",
              "axiom/physical/fixtures/captures/in-domain-synthetic-sil.response.json",
              "axiom/intelligence/fixtures/manifest.json",
              "axiom/optimization/search.py",
              "axiom/control/models.py",
          )
          for entry in required:
              if not any(name == entry or name.startswith(entry) for name in names):
                  raise SystemExit(f"release wheel is missing {entry}")
          web_assets = [name for name in names if name.startswith("axiom/web_dist/assets/")]
          if len(web_assets) != 2:
              raise SystemExit(f"release wheel must contain exactly one current JS/CSS pair: {web_assets}")

      - name: Smoke test installed wheel
        run: |
          python -m venv release-smoke
          $wheel = (Get-ChildItem -Path dist -Filter *.whl -File | Select-Object -First 1).FullName
          & .\release-smoke\Scripts\python.exe -m pip install --upgrade -c constraints/acceptance.txt pip
          & .\release-smoke\Scripts\python.exe -m pip install -c constraints/acceptance.txt $wheel
          & .\release-smoke\Scripts\axiom.exe --help
          @'
          from importlib.metadata import version
          from pathlib import Path

          import axiom
          from axiom import evaluate_run
          from axiom.five_axis.f2_runtime import current_f2_numeric_environment
          from axiom.five_axis.f2_scenarios import validate_f2_example_run_spec
          from axiom.five_axis.f3_scenarios import (
              current_f3_numeric_environment,
              validate_f3_example_run_spec,
          )
          from axiom.five_axis.f4_scenarios import (
              build_f4_stage_acceptance_report,
              validate_f4_example_run_spec,
          )
          from axiom.five_axis.f4_runtime import current_f4_numeric_environment
          from axiom.machine import (
              MACHINE_OBSERVATION_DOMAIN_PACK_ID,
              machine_r3_example_run_spec,
              load_machine_r3_manifest,
          )
          from axiom.intelligence import (
              R5_DOMAIN_PACK_ID,
              R5B_DOMAIN_PACK_ID,
              build_r5_manifest,
              build_r5b_manifest,
              load_r5_fixture_manifest,
              r5_example_payload,
              r5b_example_payload,
              validate_r5_example_run_spec,
              validate_r5b_example_run_spec,
          )
          from axiom.physical import (
              FIVE_AXIS_PHYSICAL_DOMAIN_PACK_ID,
              PhysicalModelValidationRequest,
              analyze_physical_validation,
              load_r4_manifest,
              r4_example_payload,
              validate_r4_example_run_spec,
          )
          from axiom.physical.runtime import REALITY_VALIDATED_CLAIM_ID
          from axiom.optimization import (
              R6_DOMAIN_PACK_ID,
              build_r6_manifest,
              r6_example_payload,
              validate_r6_example_run_spec,
          )
          from axiom.control import (
              R7_DOMAIN_PACK_ID,
              R7B_DOMAIN_PACK_ID,
              build_r7_manifest,
              build_r7b_manifest,
              r7_example_payload,
              r7b_example_payload,
              validate_r7_example_run_spec,
              validate_r7b_example_run_spec,
          )
          from axiom.run import validate_run_bundle_integrity

          assert version("axiom-evaluator") == "0.15.0"
          assert (Path(axiom.__file__).parent / "web_dist" / "index.html").is_file()
          expected_policy = {
              "openblasCoreType": "Haswell",
              "openblasNumThreads": "1",
              "ompNumThreads": "1",
          }
          for environment in (
              current_f2_numeric_environment(),
              current_f3_numeric_environment(),
              current_f4_numeric_environment(),
          ):
              assert expected_policy.items() <= environment.items()

          r7b_manifest = build_r7b_manifest()
          assert r7b_manifest.domain_pack_id == R7B_DOMAIN_PACK_ID
          assert r7b_manifest.device_write_allowed is False
          assert r7b_example_payload().readiness_audit.readiness_outcome == "Open"
          r7b = evaluate_run(validate_r7b_example_run_spec())
          assert validate_run_bundle_integrity(r7b) == []
          assert r7b.run.case_outcome.value == "Inconclusive"

          f2 = evaluate_run(validate_f2_example_run_spec("configuration-interior-collision"))
          assert validate_run_bundle_integrity(f2) == []
          assert f2.run.case_outcome.value == "Passed"

          f3 = evaluate_run(validate_f3_example_run_spec("canonical-table-table-jerk"))
          assert validate_run_bundle_integrity(f3) == []
          assert f3.run.case_outcome.value == "Passed"

          unsupported = evaluate_run(validate_f3_example_run_spec("second-order-proven-optimal"))
          assert validate_run_bundle_integrity(unsupported) == []
          assert unsupported.run.case_outcome.value == "Unsupported"

          f4 = evaluate_run(validate_f4_example_run_spec("canonical-head-table-solver"))
          assert validate_run_bundle_integrity(f4) == []
          assert f4.run.case_outcome.value == "Passed"
          expected_f4_claims = {
              "five-axis.geometry-valid-claim@1",
              "five-axis.task-geometry-collision-free-claim@1",
              "five-axis.kinematically-feasible-claim@1",
              "five-axis.configuration-collision-free-claim@1",
              "five-axis.continuously-feasible-claim@1",
              "five-axis.interval-certified-claim@1",
              "five-axis.model-collision-free-claim@1",
          }
          claims = {claim.claim_definition_id: claim.status.value for claim in f4.claims}
          assert {claim_id: claims[claim_id] for claim_id in expected_f4_claims} == {
              claim_id: "Supported" for claim_id in expected_f4_claims
          }
          assert not {
              "five-axis.device-safe-claim@1",
              "five-axis.process-safe-claim@1",
          }.intersection(claims)
          assert build_f4_stage_acceptance_report().status == "Passed"

          machine_manifest = load_machine_r3_manifest()
          assert machine_manifest["readOnly"] is True
          assert machine_manifest["safetyBanner"] == "READ ONLY / NOT DEVICE SAFE"
          machine = evaluate_run(machine_r3_example_run_spec("read-only-paired-pass"))
          assert validate_run_bundle_integrity(machine) == []
          assert machine.run.domain_pack_id == MACHINE_OBSERVATION_DOMAIN_PACK_ID
          assert machine.run.case_outcome.value == "Passed"
          assert machine.observation.source == "ImportedArtifact"
          assert set(machine.report.provenance.context_hashes) == {
              "deviceProfile",
              "clockMapping",
              "coordinateAlignment",
              "lineage",
          }
          machine_claims = {claim.claim_definition_id: claim.status.value for claim in machine.claims}
          assert machine_claims["machine-observation.raw-integrity-claim@1"] == "Supported"
          assert machine_claims["machine-observation.read-only-capture-claim@1"] == "Supported"
          assert not {
              "five-axis.device-safe-claim@1",
              "five-axis.process-safe-claim@1",
          }.intersection(machine_claims)

          forbidden = evaluate_run(machine_r3_example_run_spec("forbidden-write-operation"))
          assert validate_run_bundle_integrity(forbidden) == []
          assert forbidden.run.execution_status.value == "Skipped"
          assert forbidden.run.case_outcome.value == "Invalid"

          physical_manifest = load_r4_manifest()
          assert physical_manifest["platform"] == "windows"
          assert physical_manifest["safetyBanner"] == "MODEL VALIDATION / NOT DEVICE SAFE"
          assert physical_manifest["realityValidationStatus"] == "Open"
          physical_spec = validate_r4_example_run_spec("in-domain-synthetic-sil")
          physical_request = PhysicalModelValidationRequest.model_validate(
              physical_spec.request.model_dump(
                  mode="json", by_alias=True, exclude_unset=True, exclude_none=True
              )
          )
          physical_analysis = analyze_physical_validation(physical_request)
          physical_example = r4_example_payload("in-domain-synthetic-sil")
          assert physical_example["analysis"]["analysisContentHash"] == physical_analysis.content_hash
          physical = evaluate_run(physical_spec)
          assert validate_run_bundle_integrity(physical) == []
          assert physical.run.domain_pack_id == FIVE_AXIS_PHYSICAL_DOMAIN_PACK_ID
          assert physical.run.case_outcome.value == "Passed"
          physical_claims = {claim.claim_definition_id: claim.status.value for claim in physical.claims}
          assert physical_claims[REALITY_VALIDATED_CLAIM_ID] == "Inconclusive"
          assert not {
              "five-axis.device-safe-claim@1",
              "five-axis.process-safe-claim@1",
          }.intersection(physical_claims)
          mismatch = evaluate_run(validate_r4_example_run_spec("model-mismatch-detected"))
          assert validate_run_bundle_integrity(mismatch) == []
          assert mismatch.run.case_outcome.value == "Failed"
          missing_context = evaluate_run(validate_r4_example_run_spec("missing-coordinate-context"))
          assert validate_run_bundle_integrity(missing_context) == []
          assert missing_context.run.case_outcome.value == "Inconclusive"

          intelligence_manifest = build_r5_manifest()
          assert intelligence_manifest["platform"] == "windows"
          assert intelligence_manifest["stage"] == "R5-A"
          assert intelligence_manifest["syntheticLearningContractStatus"] == "Passed"
          assert intelligence_manifest["realWorldGeneralizationStatus"] == "Open"
          intelligence_example = r5_example_payload("synthetic-residual-contract")
          assert intelligence_example["evaluation"]["oodDetectionRate"] == 1.0
          assert intelligence_example["evaluation"]["conformalCoverage"] >= 0.80
          assert intelligence_example["evaluation"]["targetParityMaxAbsGap"] <= 1e-12
          intelligence = evaluate_run(validate_r5_example_run_spec("synthetic-residual-contract"))
          assert validate_run_bundle_integrity(intelligence) == []
          assert intelligence.run.domain_pack_id == R5_DOMAIN_PACK_ID
          assert intelligence.run.case_outcome.value == "Passed"
          intelligence_claims = {
              claim.claim_definition_id: claim.status.value for claim in intelligence.claims
          }
          assert intelligence_claims["intelligence.synthetic-learning-contract-claim@1"] == "Supported"
          assert intelligence_claims["intelligence.real-world-generalization-claim@1"] == "Inconclusive"
          assert not {
              "five-axis.device-safe-claim@1",
              "five-axis.process-safe-claim@1",
          }.intersection(intelligence_claims)
          fixture_manifest = load_r5_fixture_manifest()
          assert (
              fixture_manifest["expectedIdentities"]["modelBundleContentHash"]
              == intelligence_example["modelBundle"]["contentHash"]
          )

          r5b_manifest = build_r5b_manifest()
          assert r5b_manifest["platform"] == "windows"
          assert r5b_manifest["stage"] == "R5-B"
          assert r5b_manifest["contractReadinessStatus"] == "Passed"
          assert r5b_manifest["realWorldGeneralizationStatus"] == "Open"
          assert r5b_manifest["safetyBanner"] == "REAL HOLDOUT VALIDATION / NOT DEVICE SAFE"
          r5b_example = r5b_example_payload("real-holdout-readiness-open")
          assert r5b_example["realHoldoutSet"] is None
          r5b = evaluate_run(validate_r5b_example_run_spec("real-holdout-readiness-open"))
          assert validate_run_bundle_integrity(r5b) == []
          assert r5b.run.domain_pack_id == R5B_DOMAIN_PACK_ID
          assert r5b.run.execution_status.value == "Succeeded"
          assert r5b.run.case_outcome.value == "Inconclusive"
          r5b_claims = {
              claim.claim_definition_id: claim.status.value for claim in r5b.claims
          }
          assert r5b_claims["intelligence.real-world-generalization-claim@1"] == "Inconclusive"
          assert not {
              "five-axis.device-safe-claim@1",
              "five-axis.process-safe-claim@1",
          }.intersection(r5b_claims)

          r6_manifest = build_r6_manifest()
          assert r6_manifest.domain_pack_id == R6_DOMAIN_PACK_ID
          assert r6_manifest.permission_level == "Offline"
          assert r6_manifest.device_write_allowed is False
          r6_example = r6_example_payload()
          assert len(r6_example.recommendation_set.candidates) == 6
          assert r6_example.recommendation_set.pareto_candidate_ids
          assert r6_example.recommendation_set.content_hash == "f4a4bd3d44b21f9bd068005bbdd5c88c5f7c4b63b3493b3a73c72105ddf0b97d"
          assert all(candidate.hard_constraints_satisfied for candidate in r6_example.recommendation_set.candidates)
          assert all(not candidate.promotion_eligible for candidate in r6_example.recommendation_set.candidates)
          r6 = evaluate_run(validate_r6_example_run_spec())
          assert validate_run_bundle_integrity(r6) == []
          assert r6.run.domain_pack_id == R6_DOMAIN_PACK_ID
          assert r6.run.case_outcome.value == "Passed"

          r7_manifest = build_r7_manifest()
          assert r7_manifest.domain_pack_id == R7_DOMAIN_PACK_ID
          assert r7_manifest.permission_ceiling == "Shadow"
          assert r7_manifest.device_write_allowed is False
          assert r7_manifest.synthetic_shadow_contract_status == "Passed"
          assert r7_manifest.deployment_shadow_status == "Open"
          r7_example = r7_example_payload("synthetic-shadow-limit-breach")
          assert r7_example.runtime_audit.final_state == "RollbackVerified"
          assert r7_example.runtime_audit.device_write_performed is False
          assert r7_example.runtime_audit.stop_receipt.device_stop_command_issued is False
          assert r7_example.runtime_audit.rollback_receipt.device_write_issued is False
          r7 = evaluate_run(validate_r7_example_run_spec())
          assert validate_run_bundle_integrity(r7) == []
          assert r7.run.domain_pack_id == R7_DOMAIN_PACK_ID
          assert r7.run.case_outcome.value == "Passed"
          r7_claims = {claim.claim_definition_id: claim.status.value for claim in r7.claims}
          assert r7_claims["control.no-device-write-boundary-claim@1"] == "Supported"
          assert r7_claims["control.deployment-readiness-claim@1"] == "Inconclusive"
          '@ | & .\release-smoke\Scripts\python.exe -
          $server = Start-Process `
            -FilePath .\release-smoke\Scripts\axiom.exe `
            -ArgumentList @("serve", "--host", "127.0.0.1", "--port", "8765") `
            -WindowStyle Hidden `
            -PassThru `
            -RedirectStandardOutput release-smoke\server.stdout.log `
            -RedirectStandardError release-smoke\server.stderr.log
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8765/api/v1/health
                if ($health.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              Get-Content release-smoke\server.stderr.log
              throw "installed-wheel server did not become ready"
            }
            $index = (Invoke-WebRequest http://127.0.0.1:8765/).Content
            if ($index -notmatch '<div id="root"></div>') {
              throw "installed wheel did not serve the bundled workbench"
            }
            $machineManifest = Invoke-RestMethod http://127.0.0.1:8765/api/v1/machine/r3/manifest
            if (-not $machineManifest.readOnly -or $machineManifest.safetyBanner -ne "READ ONLY / NOT DEVICE SAFE") {
              throw "installed wheel did not expose the R3 read-only manifest"
            }
            $machineExample = Invoke-RestMethod "http://127.0.0.1:8765/api/v1/examples/machine-r3?scenarioId=read-only-paired-pass"
            if ($machineExample.runSpec.domainPackId -ne "machine-observation.domain-pack@1") {
              throw "installed wheel did not expose the R3 example RunSpec"
            }
            $physicalManifest = Invoke-RestMethod http://127.0.0.1:8765/api/v1/physical/r4/manifest
            if ($physicalManifest.domainPackId -ne "five-axis.domain-pack@6" -or $physicalManifest.realityValidationStatus -ne "Open") {
              throw "installed wheel did not expose the R4 Windows contract"
            }
            $physicalExample = Invoke-RestMethod "http://127.0.0.1:8765/api/v1/examples/physical-r4?scenarioId=in-domain-synthetic-sil"
            if ($physicalExample.runSpec.domainPackId -ne "five-axis.domain-pack@6") {
              throw "installed wheel did not expose the R4 example RunSpec"
            }
            $intelligenceManifest = Invoke-RestMethod http://127.0.0.1:8765/api/v1/intelligence/r5/manifest
            if ($intelligenceManifest.stage -ne "R5-A" -or $intelligenceManifest.syntheticLearningContractStatus -ne "Passed" -or $intelligenceManifest.realWorldGeneralizationStatus -ne "Open") {
              throw "installed wheel did not expose the R5-A dual-gate contract"
            }
            $intelligenceExample = Invoke-RestMethod "http://127.0.0.1:8765/api/v1/examples/intelligence-r5?scenarioId=synthetic-residual-contract"
            if ($intelligenceExample.runSpec.domainPackId -ne "intelligence.domain-pack@1" -or $intelligenceExample.evaluation.oodDetectionRate -ne 1) {
              throw "installed wheel did not expose the R5-A example contract"
            }
            $r5bManifest = Invoke-RestMethod http://127.0.0.1:8765/api/v1/intelligence/r5b/manifest
            if ($r5bManifest.stage -ne "R5-B" -or $r5bManifest.contractReadinessStatus -ne "Passed" -or $r5bManifest.realWorldGeneralizationStatus -ne "Open") {
              throw "installed wheel did not expose the R5-B readiness contract"
            }
            $r5bExample = Invoke-RestMethod "http://127.0.0.1:8765/api/v1/examples/intelligence-r5b?scenarioId=real-holdout-readiness-open"
            if ($r5bExample.runSpec.domainPackId -ne "intelligence.domain-pack@2" -or $null -ne $r5bExample.realHoldoutSet) {
              throw "installed wheel did not preserve the R5-B Open example boundary"
            }
            $r6Manifest = Invoke-RestMethod http://127.0.0.1:8765/api/v1/optimization/r6/manifest
            if ($r6Manifest.domainPackId -ne "optimization.domain-pack@1" -or $r6Manifest.permissionLevel -ne "Offline" -or $r6Manifest.deviceWriteAllowed) {
              throw "installed wheel did not expose the R6 Offline contract"
            }
            $r6Example = Invoke-RestMethod http://127.0.0.1:8765/api/v1/examples/optimization-r6
            if ($r6Example.runSpec.domainPackId -ne "optimization.domain-pack@1" -or $r6Example.recommendationSet.candidates.Count -ne 6 -or $r6Example.recommendationSet.deviceWriteAllowed) {
              throw "installed wheel did not preserve the R6 recommendation boundary"
            }
            $r7Manifest = Invoke-RestMethod http://127.0.0.1:8765/api/v1/control/r7/manifest
            if ($r7Manifest.domainPackId -ne "control.domain-pack@1" -or $r7Manifest.permissionCeiling -ne "Shadow" -or $r7Manifest.deviceWriteAllowed -or $r7Manifest.deploymentShadowStatus -ne "Open") {
              throw "installed wheel did not expose the R7-A shadow boundary"
            }
            $r7Example = Invoke-RestMethod "http://127.0.0.1:8765/api/v1/examples/control-r7?scenarioId=synthetic-shadow-limit-breach"
            if ($r7Example.runSpec.domainPackId -ne "control.domain-pack@1" -or $r7Example.runtimeAudit.finalState -ne "RollbackVerified" -or $r7Example.runtimeAudit.deviceWritePerformed) {
              throw "installed wheel did not preserve the R7-A stop and no-write contract"
            }
            $r7bManifest = Invoke-RestMethod http://127.0.0.1:8765/api/v1/control/r7b/manifest
            if ($r7bManifest.domainPackId -ne "control.domain-pack@2" -or $r7bManifest.permissionCeiling -ne "Shadow" -or $r7bManifest.deviceWriteAllowed -or $r7bManifest.vendorAdapterStatus -ne "Open" -or $r7bManifest.deploymentShadowStatus -ne "Open") {
              throw "installed wheel did not expose the R7-B readiness boundary"
            }
            $r7bExample = Invoke-RestMethod "http://127.0.0.1:8765/api/v1/examples/control-r7b?scenarioId=contract-fixture-blocked"
            if ($r7bExample.runSpec.domainPackId -ne "control.domain-pack@2" -or $r7bExample.readinessAudit.readinessOutcome -ne "Blocked" -or $r7bExample.readinessAudit.deploymentShadowStatus -ne "Open") {
              throw "installed wheel did not preserve the R7-B non-reality fixture boundary"
            }
            $openApi = Invoke-RestMethod http://127.0.0.1:8765/api/openapi.json
            if ($openApi.components.schemas.PSObject.Properties.Name -notcontains "PhysicalR4ExamplePayload") {
              throw "installed wheel did not expose the typed R4 OpenAPI contract"
            }
            if ($openApi.components.schemas.PSObject.Properties.Name -notcontains "R5ExamplePayload") {
              throw "installed wheel did not expose the typed R5 OpenAPI contract"
            }
            if ($openApi.components.schemas.PSObject.Properties.Name -notcontains "R5BExamplePayload") {
              throw "installed wheel did not expose the typed R5-B OpenAPI contract"
            }
            if ($openApi.components.schemas.PSObject.Properties.Name -notcontains "R6ExamplePayload" -or $openApi.components.schemas.PSObject.Properties.Name -notcontains "OptimizationSearchRequest") {
              throw "installed wheel did not expose the typed R6 OpenAPI contract"
            }
            if ($openApi.components.schemas.PSObject.Properties.Name -notcontains "R7ExamplePayload" -or $openApi.components.schemas.PSObject.Properties.Name -notcontains "R7ReplayRequest") {
              throw "installed wheel did not expose the typed R7-A OpenAPI contract"
            }
            if ($openApi.components.schemas.PSObject.Properties.Name -notcontains "R7BExamplePayload" -or $openApi.components.schemas.PSObject.Properties.Name -notcontains "R7BAssessmentRequest") {
              throw "installed wheel did not expose the typed R7-B OpenAPI contract"
            }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id }
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $artifacts = Get-ChildItem -Path dist -File | Select-Object -ExpandProperty FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $artifacts --clobber
          } else {
            gh release create $tag $artifacts --verify-tag --generate-notes --title "Axiom $tag"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
