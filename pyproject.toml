[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-evaluator"
version = "0.1.0"
description = "A deterministic evaluator for ordered two- and three-dimensional point sequences"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pint>=0.24",
  "pydantic>=2.10",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.120",
  "pytest>=8.3",
]

[project.scripts]
axiom = "axiom.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
