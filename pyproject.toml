[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-evaluator"
version = "0.21.0"
description = "A deterministic, domain-extensible industrial algorithm evaluation framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "numpy>=2.0",
  "pint>=0.24",
  "pydantic>=2.10",
  "scipy>=1.14",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.120",
  "httpx>=0.28,<0.29",
  "pytest>=8.3",
]

[project.scripts]
axiom = "axiom.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axiom = [
  "web_dist/**",
  "five_axis/fixtures/*.json",
  "machine/fixtures/*.json",
  "machine/fixtures/captures/*.json",
  "physical/fixtures/*.json",
  "physical/fixtures/captures/*.json",
  "intelligence/fixtures/*.json",
  "control/deployment/*.TcPOU",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
